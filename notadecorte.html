<!DOCTYPE html>
<html lang="pt-BR">

  <title>Histórico de Notas de Corte</title>

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --border-color: #e2e8f0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px 0;
    }

    p {
      color: #64748b;
      margin: 0;
    }

    .controls {
      margin: 20px 0;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    select {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #fff;
      font-size: 1rem;
      color: var(--text-color);
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: #2563eb;
    }

    .chart-container {
      position: relative;
      height: 450px;
      width: 100%;
    }
  </style>
</head>
<body>

    </header>

    <div class="controls">
      <label for="cursoSelect"><strong>Curso:</strong></label>

    <div class="chart-container">
      <canvas id="graficoNotas"></canvas>

  </div>

  publica: "Escola Pública",
  negros: "Negros",
  negrosPublica: "Escola Pública + Negros",
  pcd: "PCD"
};

const cotaCores = {
  universal: "#2563eb",
  publica: "#16a34a",
  negros: "#d97706",
  negrosPublica: "#9333ea",
  pcd: "#dc2626"
};

const anos = ["2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"];

const selectEl = document.getElementById("cursoSelect");
const ctx = document.getElementById("graficoNotas").getContext("2d");
let meugrafico = null;

notasDeCorte.forEach((item, index) => {
  const option = document.createElement("option");
  option.value = index;
  option.textContent = `${item.curso} (${item.modalidade})`;
  selectEl.appendChild(option);
});

function parseValor(val) {
  if (val === null || isNaN(val)) return null;
  return Number(val);
}

function atualizarGrafico(index) {
  const cursoDados = notasDeCorte[index];

  const datasets = Object.keys(cursoDados.historicoCotas).map(cotaKey => {
    const historico = cursoDados.historicoCotas[cotaKey];
    const data = anos.map(ano => parseValor(historico[ano]));

    return {
      label: cotaLabels[cotaKey] || cotaKey,
      data: data,
      borderColor: cotaCores[cotaKey] || "#000",
      backgroundColor: cotaCores[cotaKey] || "#000",
      borderWidth: 2,
      spanGaps: true,
      tension: 0.2
    };
  });

  if (meugrafico) {
    meugrafico.destroy();
  }

  meugrafico = new Chart(ctx, {
    type: 'line',
    data: {
      labels: anos,
      datasets: datasets
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom' },
        tooltip: {
          callbacks: {
            label: (context) => `${context.dataset.label}: ${context.raw !== null ? context.raw : 'Sem dados'}`
          }
        }
      },
      scales: {
        y: {
          beginAtZero: false,
          title: { display: true, text: 'Pontuação / Nota' }
        },
        x: {
          title: { display: true, text: 'Ano' }
        }
      }
    }
  });
}

selectEl.addEventListener("change", (e) => atualizarGrafico(e.target.value));
atualizarGrafico(0);
